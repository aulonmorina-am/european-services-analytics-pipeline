version: 2

sources:
  - name: eurostat
    description: "Eurostat international trade in services datasets."
    database: EUROPEAN_SERVICES_RAW
    schema: RAW

    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: { count: 45, period: day }
        error_after: { count: 60, period: day }

    tables:
      - name: bop_its_6_det
        description: "Balance of Payments international trade in services, detailed breakdown."

        columns:
          - name: freq
            data_tests: [not_null]

          - name: currency
            data_tests: [not_null]

          - name: bop_item
            data_tests: [not_null]

          - name: stk_flow
            data_tests: [not_null]

          - name: partner
            data_tests: [not_null]

          - name: geo
            data_tests: [not_null]

          - name: time_period
            data_tests: [not_null]

          - name: last_update
            data_tests: [not_null]

      - name: ext_stec_01
        description: "Services trade by NACE activity and enterprise size class."

        columns:
          - name: geo
            data_tests: [not_null]

          - name: time_period
            data_tests: [not_null]

      - name: ext_stec_02
        description: "Services trade by NACE activity and EBOPS 2010 service product."

        columns:
          - name: geo
            data_tests: [not_null]

          - name: time_period
            data_tests: [not_null]

      - name: ext_stec_03
        description: "Services trade by NACE activity and enterprise control."

        columns:
          - name: geo
            data_tests: [not_null]

          - name: time_period
            data_tests: [not_null]
