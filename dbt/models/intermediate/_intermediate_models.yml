version: 2

models:
  - name: int_bop_item
    description: "Service classification dimension (BPM6 bop_item). Seed-backed with labels, hierarchy and the ICT focus flag (SI* = telecommunications, computer and information services)."
    columns:
      - name: bop_item
        description: "BPM6 service code."
        data_tests: [not_null, unique]
      - name: bop_item_label
        data_tests: [not_null]
      - name: parent_bop_item
        description: "Parent code in the BPM6 hierarchy (null for the total 'S')."
        data_tests:
          - relationships:
              arguments:
                to: ref('int_bop_item')
                field: bop_item
                config:
                  where: "parent_bop_item is not null"
      - name: is_ict_service
        description: "True for SI* codes (telecom, computer and information services)."
        data_tests: [not_null]

  - name: int_partner
    description: "Partner dimension: countries vs geopolitical aggregates (extra-EU27, rest of world, ...)."
    columns:
      - name: partner
        data_tests: [not_null, unique]
      - name: partner_label
        data_tests: [not_null]
      - name: partner_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [country, aggregate]
      - name: is_eu_member
        data_tests: [not_null]
      - name: is_extra_eu_aggregate
        data_tests: [not_null]

  - name: int_geo_area
    description: "Reporting-area dimension (geo codes actually extracted)."
    columns:
      - name: geo
        data_tests: [not_null, unique]
      - name: geo_label
        data_tests: [not_null]
      - name: is_eu_aggregate
        data_tests: [not_null]
      - name: is_eu_member
        data_tests: [not_null]

  - name: int_bop_its_6_det
    description: "Typed fact for BPM6 trade in services: one row per frequency/currency/bop_item/flow/partner/geo/year, values converted to EUR, joined to all reference dimensions."
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: frequency
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('frequencies')
                field: frequency
      - name: bop_item
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_bop_item')
                field: bop_item
      - name: bop_flow
        description: "BPM6 flow: CRE=credit/exports, DEB=debit/imports, BAL=balance. Codes are disjoint from the stec EXP/IMP codes."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('flows')
                field: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_partner')
                field: partner
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_geo_area')
                field: geo
      - name: year
        description: "Reference year (annual data)."
        data_tests: [not_null]
      - name: value_eur
        description: "Observation value converted to euro (currency unit multiplier applied)."
      - name: is_value_missing
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('units')
                field: unit
      - name: flow_direction
        data_tests:
          - accepted_values:
              arguments:
                values: [exports, imports, balance]

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - frequency
              - currency
              - bop_item
              - bop_flow
              - partner
              - geo
              - year

  - name: int_ext_stec_union
    description: "Unified enterprise-characteristics fact across ext_stec01 (size class), ext_stec02 (EBOPS product) and ext_stec03 (enterprise control); values in EUR."
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: characteristic_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [size_class, ebops_2010, enterprise_control]
      - name: characteristic_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stec_characteristics')
                field: characteristic_code
      - name: nace_r_2
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nace_r2')
                field: nace_r_2
      - name: trade_flow
        description: "EXP=exports, IMP=imports. Codes are disjoint from the bop BAL/CRE/DEB codes."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('flows')
                field: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_partner')
                field: partner
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_geo_area')
                field: geo
      - name: year
        data_tests: [not_null]
      - name: value_eur
        description: "Observation value converted to euro (THS_EUR x 1000)."
      - name: unit
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('units')
                field: unit

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - characteristic_type
              - characteristic_code
              - frequency
              - unit
              - nace_r_2
              - trade_flow
              - partner
              - geo
              - year
