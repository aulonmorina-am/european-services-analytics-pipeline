version: 2

models:
  - name: fct_bop_services_trade
    description: "Fact: BPM6 international trade in services, one row per year x service x flow x partner x reporting area, value in EUR. Long grain — BAL/CRE/DEB kept as rows via dim_flow."
    semantic_model:
      enabled: true
    # Default time dimension for the model's metrics (annual data, stored as Jan 1).
    agg_time_dimension: year_start
    columns:
      - name: observation_key
        description: "Surrogate key over frequency + currency + bop_item + bop_flow + partner + geo + time_period (see int_bop_its_6_det). Wider than the mart grain so it stays unique if currency/frequency vary."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: bop_observation
        dimension:
          type: categorical
          name: bop_observation_key
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
        entity:
          type: foreign
          name: calendar_year
        dimension:
          type: categorical
          name: year_number
      - name: year_start
        description: "January 1 of the observation year; time dimension backing the metrics."
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
          label: Year
      - name: bop_item
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: bop_item
        entity:
          type: foreign
          name: service
        dimension:
          type: categorical
          name: service_code
      - name: flow_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flow')
                field: flow_code
        entity:
          type: foreign
          name: flow
        dimension:
          type: categorical
          name: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner
        entity:
          type: foreign
          name: partner
        dimension:
          type: categorical
          name: partner_code
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo
        entity:
          type: foreign
          name: geo
        dimension:
          type: categorical
          name: geo_code
      - name: value_eur
        description: "Observation value in euro. NULL is legitimate for confidential/missing observations (~18% of rows) — see the consistency singular test."
      - name: is_value_missing
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, bop_item, flow_code, partner, geo]
    metrics:
      - name: bop_trade_value_eur
        description: "Sum of values in EUR at the reporting grain: BPM6 sections, one reporter, partner pinned to WRL_REST."
        label: "BOP trade value (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: bop_observations
        label: "BOP observations"
        type: simple
        agg: count
        expr: observation_key
      - name: bop_missing_observations
        description: "Count of observations with NULL value (confidential/missing)."
        label: "BOP missing observations"
        type: simple
        agg: sum_boolean
        expr: is_value_missing
      - name: bop_exports_eur
        description: "Exports in EUR at the reporting grain: each reporter's total to the world. Use bop_exports_eur_by_partner for partner breakdowns."
        label: "Exports (EUR, BPM6)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: bop_imports_eur
        description: "Imports in EUR at the reporting grain: each reporter's total from the world."
        label: "Imports (EUR, BPM6)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'imports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: bop_balance_eur
        description: "Balance flows (BAL) in EUR at the reporting grain."
        label: "Balance (EUR, BPM6)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'balance' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: bop_net_balance_eur
        description: "Exports minus imports; should reconcile with bop_balance_eur."
        label: "BOP net balance (EUR)"
        type: derived
        expr: exports - imports
        input_metrics:
          - name: bop_exports_eur
            alias: exports
          - name: bop_imports_eur
            alias: imports
      - name: bop_exports_yoy_growth
        description: "Year-over-year growth of exports."
        label: "BOP exports YoY growth"
        type: derived
        expr: (exports - exports_prev_year) / nullif(exports_prev_year, 0)
        input_metrics:
          - name: bop_exports_eur
            alias: exports
          - name: bop_exports_eur
            alias: exports_prev_year
            offset_window: 1 year
      - name: bop_ict_exports_share
        description: "Share of exports going to ICT services (SI*). Derived rather than ratio: a ratio over the same metric twice compiles to duplicate CTE columns and Snowflake rejects it."
        label: "ICT share of exports"
        type: derived
        expr: ict_exports / nullif(total_exports, 0)
        input_metrics:
          - name: bop_exports_eur
            alias: ict_exports
            filter: "{{ Dimension('service__is_ict_service') }} = true"
          - name: bop_exports_eur
            alias: total_exports
      - name: bop_exports_eur_by_partner
        description: "Exports in EUR by partner country. A breakdown, not a headline total — country rows exclude unallocated and confidential value."
        label: "Exports by partner (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: bop_extra_eu_exports_share
        description: "Share of exports going outside the EU, over country-level partner rows."
        label: "Extra-EU share of exports"
        type: derived
        expr: extra_eu_exports / nullif(total_country_exports, 0)
        input_metrics:
          - name: bop_exports_eur_by_partner
            alias: extra_eu_exports
            filter: "{{ Dimension('partner__is_eu_member') }} = false"
          - name: bop_exports_eur_by_partner
            alias: total_country_exports
      # ---------------------------------------------------------------------
      # EU27 aggregate-row variant: Eurostat ships EU27_2020 as a pre-computed
      # row alongside the member rows. The base metric excludes it.
      # ---------------------------------------------------------------------
      - name: bop_exports_eur_eu27
        description: "EU27 total exports to the world, from the pre-computed EU27_2020 row. Do not combine with bop_exports_eur."
        label: "BOP exports (EUR, EU27 aggregate row)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__geo_code') }} = 'EU27_2020' AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"

  - name: fct_stec_services_trade
    description: "Fact: services trade by enterprise characteristics (ext_stec01/02/03), one row per year x characteristic x nace x flow x partner x geo, value in EUR."
    semantic_model:
      enabled: true
    # Default time dimension for the model's metrics (annual data, stored as Jan 1).
    agg_time_dimension: year_start
    columns:
      - name: observation_key
        description: "Surrogate key over characteristic_type + characteristic_code + frequency + unit + nace_r_2 + trade_flow + partner + geo + time_period (see int_ext_stec_union). Wider than the mart grain so it stays unique if unit/frequency vary."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: stec_observation
        dimension:
          type: categorical
          name: stec_observation_key
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
        entity:
          type: foreign
          name: calendar_year
        dimension:
          type: categorical
          name: year_number
      - name: year_start
        description: "January 1 of the observation year; time dimension backing the metrics."
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
          label: Year
      - name: characteristic_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_enterprise_characteristic')
                field: characteristic_key
        entity:
          type: foreign
          name: characteristic
        dimension:
          type: categorical
          name: characteristic_key
      - name: characteristic_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [size_class, ebops_2010, enterprise_control]
        dimension:
          type: categorical
          name: characteristic_type
      - name: characteristic_code
        data_tests:
          - not_null
        dimension:
          type: categorical
          name: characteristic_code
      - name: characteristic_is_reporting_level
        description: "TRUE for the EBOPS-2010 service sections. The size_class and enterprise_control partitions are alternative cuts of the same population, so summing across them triple-counts."
        data_tests: [not_null]
        dimension:
          type: categorical
          name: characteristic_is_reporting_level
      - name: nace_r_2
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nace_activity')
                field: nace_r_2
        entity:
          type: foreign
          name: nace
        dimension:
          type: categorical
          name: nace_code
      - name: flow_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flow')
                field: flow_code
        entity:
          type: foreign
          name: flow
        dimension:
          type: categorical
          name: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner
        entity:
          type: foreign
          name: partner
        dimension:
          type: categorical
          name: partner_code
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo
        entity:
          type: foreign
          name: geo
        dimension:
          type: categorical
          name: geo_code
      - name: value_eur
        description: "Observation value in euro. NULL is legitimate for confidential/missing observations — see the consistency singular test."
      - name: is_value_missing
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [
                year,
                characteristic_type,
                characteristic_code,
                nace_r_2,
                flow_code,
                partner,
                geo,
              ]
    metrics:
      - name: stec_trade_value_eur
        description: "Sum of values in EUR at the reporting grain: EBOPS sections, NACE sections, one reporter, partner pinned to WRL_REST."
        label: "STEC trade value (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: stec_observations
        label: "STEC observations"
        type: simple
        agg: count
        expr: observation_key
      - name: stec_missing_observations
        description: "Count of observations with NULL value (confidential/missing)."
        label: "STEC missing observations"
        type: simple
        agg: sum_boolean
        expr: is_value_missing
      - name: stec_exports_eur
        description: "Exports in EUR from the STEC enterprise survey: each reporter's total to the world. Not interchangeable with bop_exports_eur — smaller reporter set."
        label: "Exports by enterprise (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: stec_imports_eur
        description: "Imports in EUR as reported by the STEC enterprise survey: each reporter's total from the world."
        label: "Imports by enterprise (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'imports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
      - name: stec_net_balance_eur
        description: "Exports minus imports."
        label: "STEC net balance (EUR)"
        type: derived
        expr: exports - imports
        input_metrics:
          - name: stec_exports_eur
            alias: exports
          - name: stec_imports_eur
            alias: imports
      - name: stec_exports_yoy_growth
        description: "Year-over-year growth of exports."
        label: "STEC exports YoY growth"
        type: derived
        expr: (exports - exports_prev_year) / nullif(exports_prev_year, 0)
        input_metrics:
          - name: stec_exports_eur
            alias: exports
          - name: stec_exports_eur
            alias: exports_prev_year
            offset_window: 1 year
      - name: stec_j_sector_exports_share
        description: "Share of exports by NACE section J enterprises (information & communication)."
        label: "NACE J share of exports"
        type: derived
        expr: j_sector_exports / nullif(total_exports, 0)
        input_metrics:
          - name: stec_exports_eur
            alias: j_sector_exports
            filter: "{{ Dimension('nace__nace_section') }} = 'J'"
          - name: stec_exports_eur
            alias: total_exports
      # ---------------------------------------------------------------------
      # EU27 aggregate-row variant: Eurostat ships EU27_2020 as a pre-computed
      # row alongside the member rows. The base metrics exclude it.
      # ---------------------------------------------------------------------
      - name: stec_exports_eur_eu27
        description: "EU27 total exports to the world, read from the pre-computed EU27_2020 row. Do not combine with stec_exports_eur, which sums the member reporters."
        label: "STEC exports (EUR, EU27 aggregate row)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__geo_code') }} = 'EU27_2020' AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
