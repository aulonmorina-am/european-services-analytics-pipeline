version: 2

models:
  - name: fct_bop_services_trade
    description: "Fact: BPM6 international trade in services, one row per year x service x flow x partner x reporting area, value in EUR. Long grain — BAL/CRE/DEB kept as rows via dim_flow."
    semantic_model:
      enabled: true
    # Default time dimension for the model's metrics (annual data, stored as Jan 1).
    agg_time_dimension: year_start
    columns:
      - name: observation_key
        description: "Surrogate key over frequency + currency + bop_item + bop_flow + partner + geo + time_period (see int_bop_its_6_det). Wider than the mart grain so it stays unique if currency/frequency vary."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: bop_observation
        dimension:
          type: categorical
          name: bop_observation_key
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
        entity:
          type: foreign
          name: calendar_year
        dimension:
          type: categorical
          name: year_number
      - name: year_start
        description: "January 1 of the observation year; time dimension backing the metrics."
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
          label: Year
      - name: bop_item
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: bop_item
        entity:
          type: foreign
          name: service
        dimension:
          type: categorical
          name: service_code
      - name: flow_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flow')
                field: flow_code
        entity:
          type: foreign
          name: flow
        dimension:
          type: categorical
          name: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner
        entity:
          type: foreign
          name: partner
        dimension:
          type: categorical
          name: partner_code
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo
        entity:
          type: foreign
          name: geo
        dimension:
          type: categorical
          name: geo_code
      - name: value_eur
        description: "Observation value in euro. NULL is legitimate for confidential/missing observations (~18% of rows) — see the consistency singular test."
      - name: is_value_missing
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, bop_item, flow_code, partner, geo]
    metrics:
      - name: bop_trade_value_eur
        description: "Sum of observation values in EUR at the reporting grain. NULL means confidential/missing and is ignored by SUM — never coalesced to 0. Three filters are required: service__is_reporting_level keeps only the BPM6 sections (S and its sub-items overlap); geo__is_eu_aggregate = false keeps one reporter level (EU27_2020 overlaps its member countries); partner__partner_type = 'country' keeps one partner level (WRL_REST, EXT_EU27_2020 and the regional aggregates overlap their members). Without the partner/geo filters each euro is counted once per overlapping aggregate, inflating the total ~5x."
        label: "BOP trade value (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: bop_observations
        label: "BOP observations"
        type: simple
        agg: count
        expr: observation_key
      - name: bop_missing_observations
        description: "Count of observations with NULL value (confidential/missing)."
        label: "BOP missing observations"
        type: simple
        agg: sum_boolean
        expr: is_value_missing
      - name: bop_exports_eur
        description: "Exports in EUR at the reporting grain. Filters to exports AND all three grain filters — service__is_reporting_level (BPM6 sections), geo__is_eu_aggregate = false (one reporter) and partner__partner_type = 'country' (one partner level). Without them each euro is counted once per overlapping aggregate, over-counting ~5x."
        label: "Exports (EUR, BPM6 credit)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: bop_imports_eur
        description: "Imports in EUR at the reporting grain. See bop_exports_eur on why the three grain filters are required."
        label: "Imports (EUR, BPM6 debit)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'imports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: bop_balance_eur
        description: "Balance flows (BAL) in EUR at the reporting grain. See bop_exports_eur on why the three grain filters are required."
        label: "Balance (EUR, BPM6)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'balance' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: bop_net_balance_eur
        description: "Exports minus imports; should reconcile with bop_balance_eur."
        label: "BOP net balance (EUR)"
        type: derived
        expr: exports - imports
        input_metrics:
          - name: bop_exports_eur
            alias: exports
          - name: bop_imports_eur
            alias: imports
      - name: bop_exports_yoy_growth
        description: "Year-over-year growth of exports."
        label: "BOP exports YoY growth"
        type: derived
        expr: (exports - exports_prev_year) / nullif(exports_prev_year, 0)
        input_metrics:
          - name: bop_exports_eur
            alias: exports
          - name: bop_exports_eur
            alias: exports_prev_year
            offset_window: 1 year
      - name: bop_ict_exports_share
        description: "Share of exports going to ICT services (SI*: telecom, computer, information) of total exports. Implemented as derived (aliased inputs) rather than ratio — a ratio over the same metric twice compiles to two identically-named CTE columns and Snowflake raises 'ambiguous column name'."
        label: "ICT share of exports"
        type: derived
        expr: ict_exports / nullif(total_exports, 0)
        input_metrics:
          - name: bop_exports_eur
            alias: ict_exports
            filter: "{{ Dimension('service__is_ict_service') }} = true"
          - name: bop_exports_eur
            alias: total_exports
      - name: bop_extra_eu_exports_share
        description: "Share of exports to non-EU countries of total exports to countries. Both numerator and denominator are restricted to partner__partner_type = 'country' so the populations match (aggregate rows such as EXT_EU27_2020 and WRL_REST overlap the countries they contain). Implemented as derived (aliased inputs) rather than ratio — see bop_ict_exports_share."
        label: "Extra-EU share of exports"
        type: derived
        expr: extra_eu_exports / nullif(total_country_exports, 0)
        input_metrics:
          - name: bop_exports_eur
            alias: extra_eu_exports
            filter: "{{ Dimension('partner__is_eu_member') }} = false"
          - name: bop_exports_eur
            alias: total_country_exports
      # ---------------------------------------------------------------------
      # Bloc-level variant. The base metric always keeps one reporter and one
      # partner level. This variant deliberately reads the EU27_2020 reporter
      # row with WRL_REST as the partner: the bloc's own reported total.
      # ---------------------------------------------------------------------
      - name: bop_exports_eur_eu27
        description: "EU27 bloc exports to the world: the EU27_2020 reporter row with WRL_REST as partner. Counted once — do not combine with bop_exports_eur (which sums member reporters)."
        label: "BOP exports (EUR, EU27 bloc)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('service__is_reporting_level') }} = true AND {{ Dimension('geo__geo_code') }} = 'EU27_2020' AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"

  - name: fct_stec_services_trade
    description: "Fact: services trade by enterprise characteristics (ext_stec01/02/03), one row per year x characteristic x nace x flow x partner x geo, value in EUR."
    semantic_model:
      enabled: true
    # Default time dimension for the model's metrics (annual data, stored as Jan 1).
    agg_time_dimension: year_start
    columns:
      - name: observation_key
        description: "Surrogate key over characteristic_type + characteristic_code + frequency + unit + nace_r_2 + trade_flow + partner + geo + time_period (see int_ext_stec_union). Wider than the mart grain so it stays unique if unit/frequency vary."
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: stec_observation
        dimension:
          type: categorical
          name: stec_observation_key
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
        entity:
          type: foreign
          name: calendar_year
        dimension:
          type: categorical
          name: year_number
      - name: year_start
        description: "January 1 of the observation year; time dimension backing the metrics."
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
          label: Year
      - name: characteristic_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_enterprise_characteristic')
                field: characteristic_key
        entity:
          type: foreign
          name: characteristic
        dimension:
          type: categorical
          name: characteristic_key
      - name: characteristic_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [size_class, ebops_2010, enterprise_control]
        dimension:
          type: categorical
          name: characteristic_type
      - name: characteristic_code
        data_tests:
          - not_null
        dimension:
          type: categorical
          name: characteristic_code
      - name: characteristic_is_reporting_level
        description: "TRUE for the single 'all characteristics' row of each characteristic type (size_class TOTAL, ebops_2010 S, enterprise_control TOTAL). The three types are independent partitions of the same population and each contains nested codes, so value metrics filter to this column."
        data_tests: [not_null]
        dimension:
          type: categorical
          name: characteristic_is_reporting_level
      - name: nace_r_2
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nace_activity')
                field: nace_r_2
        entity:
          type: foreign
          name: nace
        dimension:
          type: categorical
          name: nace_code
      - name: flow_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flow')
                field: flow_code
        entity:
          type: foreign
          name: flow
        dimension:
          type: categorical
          name: flow_code
      - name: partner
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partner')
                field: partner
        entity:
          type: foreign
          name: partner
        dimension:
          type: categorical
          name: partner_code
      - name: geo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo
        entity:
          type: foreign
          name: geo
        dimension:
          type: categorical
          name: geo_code
      - name: value_eur
        description: "Observation value in euro. NULL is legitimate for confidential/missing observations — see the consistency singular test."
      - name: is_value_missing
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [
                year,
                characteristic_type,
                characteristic_code,
                nace_r_2,
                flow_code,
                partner,
                geo,
              ]
    metrics:
      - name: stec_trade_value_eur
        description: "Sum of observation values in EUR at the reporting grain. NULL means confidential/missing and is ignored by SUM — never coalesced to 0. Four filters are required: characteristic__is_reporting_level keeps only the EBOPS-2010 service sections (ext_stec01/02/03 are three independent views of the same population — size_class and enterprise_control are alternative cuts, so summing all three triple-counts); nace__is_reporting_level keeps only the NACE section rows (TOTAL, A_B, UNK ... overlap the sections); geo__is_eu_aggregate = false keeps one reporter level; partner__partner_type = 'country' keeps one partner level. Without the last two each euro is counted once per overlapping aggregate, over-counting ~4.9x."
        label: "STEC trade value (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: stec_observations
        label: "STEC observations"
        type: simple
        agg: count
        expr: observation_key
      - name: stec_missing_observations
        description: "Count of observations with NULL value (confidential/missing)."
        label: "STEC missing observations"
        type: simple
        agg: sum_boolean
        expr: is_value_missing
      - name: stec_exports_eur
        description: "Exports in EUR at the reporting grain. See stec_trade_value_eur on why the four grain filters are required."
        label: "Exports (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: stec_imports_eur
        description: "Imports in EUR at the reporting grain. See stec_trade_value_eur on why the four grain filters are required."
        label: "Imports (EUR)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'imports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__is_eu_aggregate') }} = false AND {{ Dimension('partner__partner_type') }} = 'country'"
      - name: stec_net_balance_eur
        description: "Exports minus imports."
        label: "STEC net balance (EUR)"
        type: derived
        expr: exports - imports
        input_metrics:
          - name: stec_exports_eur
            alias: exports
          - name: stec_imports_eur
            alias: imports
      - name: stec_exports_yoy_growth
        description: "Year-over-year growth of exports."
        label: "STEC exports YoY growth"
        type: derived
        expr: (exports - exports_prev_year) / nullif(exports_prev_year, 0)
        input_metrics:
          - name: stec_exports_eur
            alias: exports
          - name: stec_exports_eur
            alias: exports_prev_year
            offset_window: 1 year
      - name: stec_j_sector_exports_share
        description: "Share of exports by enterprises in NACE section J (information & communication) of total exports. Implemented as derived (aliased inputs) rather than ratio — see bop_ict_exports_share."
        label: "NACE J share of exports"
        type: derived
        expr: j_sector_exports / nullif(total_exports, 0)
        input_metrics:
          - name: stec_exports_eur
            alias: j_sector_exports
            filter: "{{ Dimension('nace__nace_section') }} = 'J'"
          - name: stec_exports_eur
            alias: total_exports
      # ---------------------------------------------------------------------
      # Bloc-level variants. The base metrics above always keep one reporter
      # and one partner level, so they never count the EU27 aggregate row.
      # These variants deliberately read the EU27_2020 reporter row with
      # WRL_REST as the partner: the bloc's own reported total, counted once.
      # Use them for EU-level headline cards; use the base metrics for
      # reporter comparisons and partner breakdowns.
      # ---------------------------------------------------------------------
      - name: stec_exports_eur_eu27
        description: "EU27 bloc exports to the world: the EU27_2020 reporter row with WRL_REST as partner. Counted once — do not combine with stec_exports_eur (which sums member reporters)."
        label: "STEC exports (EUR, EU27 bloc)"
        type: simple
        agg: sum
        expr: value_eur
        filter: "{{ Dimension('flow__flow_direction') }} = 'exports' AND {{ Dimension('stec_observation__characteristic_is_reporting_level') }} = true AND {{ Dimension('nace__is_reporting_level') }} = true AND {{ Dimension('geo__geo_code') }} = 'EU27_2020' AND {{ Dimension('partner__partner_code') }} = 'WRL_REST'"
