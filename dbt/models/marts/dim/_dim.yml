version: 2

models:
  - name: dim_year
    description: "Calendar dimension derived from the facts (annual data, currently 2022-2024)."
    columns:
      - name: year
        data_tests: [not_null, unique]
      - name: is_latest_year
        data_tests: [not_null]

  - name: dim_service
    description: "Service classification dimension (BPM6 bop_item) with hierarchy level for drill-down. Filter to one service_level in BI — totals already contain their children."
    columns:
      - name: bop_item
        data_tests: [not_null, unique]
      - name: bop_item_label
        data_tests: [not_null]
      - name: parent_bop_item
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_service')
                field: bop_item
                config:
                  where: "parent_bop_item is not null"
      - name: service_level
        data_tests: [not_null]
      - name: is_ict_service
        description: "True for SI* codes (telecommunications, computer and information services)."
        data_tests: [not_null]

  - name: dim_partner
    description: "Partner dimension: countries vs geopolitical aggregates. Aggregates overlap their member countries — never sum both."
    columns:
      - name: partner
        data_tests: [not_null, unique]
      - name: partner_label
        data_tests: [not_null]
      - name: partner_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [country, aggregate]
      - name: is_eu_member
        data_tests: [not_null]
      - name: is_extra_eu_aggregate
        data_tests: [not_null]

  - name: dim_geo
    description: "Reporting-area dimension. EU27_2020 overlaps member-country rows — never sum both."
    columns:
      - name: geo
        data_tests: [not_null, unique]
      - name: geo_label
        data_tests: [not_null]
      - name: is_eu_aggregate
        data_tests: [not_null]
      - name: is_eu_member
        data_tests: [not_null]

  - name: dim_flow
    description: "Flow dimension shared by both facts (bop: BAL/CRE/DEB; stec: EXP/IMP). Codes are disjoint across groups."
    columns:
      - name: flow_code
        data_tests: [not_null, unique]
      - name: flow_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bop, stec]
      - name: flow_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exports, imports, balance]

  - name: dim_nace_activity
    description: "Economic activity dimension (NACE rev. 2) for the stec fact; nace_section is the one-letter section."
    columns:
      - name: nace_r_2
        data_tests: [not_null, unique]
      - name: nace_r_2_label
        data_tests: [not_null]
      - name: nace_section
        data_tests: [not_null]

  - name: dim_enterprise_characteristic
    description: "Enterprise characteristic dimension for the stec fact (size class, EBOPS 2010 product, enterprise control). Composite key: characteristic_type + characteristic_code."
    columns:
      - name: characteristic_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [size_class, ebops_2010, enterprise_control]
      - name: characteristic_code
        data_tests: [not_null]
      - name: characteristic_label
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [characteristic_type, characteristic_code]
