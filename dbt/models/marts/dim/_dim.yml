version: 2

models:
  - name: dim_year
    description: "Calendar dimension derived from the facts (annual data, currently 2022-2024). Doubles as the MetricFlow time spine (year_start at day granularity)."
    semantic_model:
      enabled: true
    agg_time_dimension: year_start
    # MetricFlow requires a time spine with granularity DAY or finer; for annual
    # data one row per year (Jan 1) at day granularity is sufficient.
    time_spine:
      standard_granularity_column: year_start
    columns:
      - name: year
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: calendar_year
        dimension:
          type: categorical
          name: year_number
      - name: year_start
        description: "January 1 of the year; time dimension for the semantic layer."
        data_tests: [not_null]
        granularity: day
        dimension:
          type: time
          label: Year
      - name: is_latest_year
        data_tests: [not_null]
        dimension:
          type: categorical

  - name: dim_service
    description: "Service classification dimension (BPM6 bop_item) with hierarchy level for drill-down. Filter to one service_level in BI — totals already contain their children."
    semantic_model:
      enabled: true
    columns:
      - name: bop_item
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: service
        dimension:
          type: categorical
          name: service_code
      - name: bop_item_label
        data_tests: [not_null]
        dimension:
          type: categorical
          label: "Service"
      - name: parent_bop_item
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_service')
                field: bop_item
                config:
                  where: "parent_bop_item is not null"
        dimension:
          type: categorical
      - name: service_level
        description: "Hierarchy level: 0 = total 'S', 1 = sections, 2-3 = sub-items. Never sum across levels."
        data_tests: [not_null]
        dimension:
          type: categorical
      - name: is_reporting_level
        description: "True for level 1 (sections SA..SZ), the reporting grain. Value metrics filter to this so consumers never sum across the hierarchy. Use this instead of hardcoding service_level = 1."
        data_tests: [not_null]
        dimension:
          type: categorical
      - name: is_ict_service
        description: "True for SI* codes (telecommunications, computer and information services)."
        data_tests: [not_null]
        dimension:
          type: categorical

  - name: dim_partner
    description: "Partner dimension: countries vs geopolitical aggregates. Aggregates overlap their member countries — never sum both."
    semantic_model:
      enabled: true
    columns:
      - name: partner
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: partner
        dimension:
          type: categorical
          name: partner_code
      - name: partner_label
        data_tests: [not_null]
        dimension:
          type: categorical
          label: "Partner"
      - name: partner_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [country, aggregate]
        dimension:
          type: categorical
      - name: is_eu_member
        data_tests: [not_null]
        dimension:
          type: categorical
      - name: is_extra_eu_aggregate
        data_tests: [not_null]
        dimension:
          type: categorical

  - name: dim_geo
    description: "Reporting-area dimension. EU27_2020 overlaps member-country rows — never sum both."
    semantic_model:
      enabled: true
    columns:
      - name: geo
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: geo
        dimension:
          type: categorical
          name: geo_code
      - name: geo_label
        data_tests: [not_null]
        dimension:
          type: categorical
          label: "Reporting area"
      - name: is_eu_aggregate
        data_tests: [not_null]
        dimension:
          type: categorical
      - name: is_eu_member
        data_tests: [not_null]
        dimension:
          type: categorical

  - name: dim_flow
    description: "Flow dimension shared by both facts (bop: BAL/CRE/DEB; stec: EXP/IMP). Codes are disjoint across groups."
    semantic_model:
      enabled: true
    columns:
      - name: flow_code
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: flow
        dimension:
          type: categorical
          name: flow_code
      - name: flow_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bop, stec]
        dimension:
          type: categorical
      - name: flow_label
        dimension:
          type: categorical
          label: "Flow"
      - name: flow_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exports, imports, balance]
        dimension:
          type: categorical

  - name: dim_nace_activity
    description: "Economic activity dimension (NACE rev. 2) for the stec fact. Codes are a mix of single sections (J = information & communication) and grouped ones (A_B, D_E, I_L_O-U); only single sections are additive."
    semantic_model:
      enabled: true
    columns:
      - name: nace_r_2
        data_tests: [not_null, unique]
        entity:
          type: primary
          name: nace
        dimension:
          type: categorical
          name: nace_code
      - name: nace_r_2_label
        data_tests: [not_null]
        dimension:
          type: categorical
          label: "NACE activity"
      - name: is_reporting_level
        description: "True for the single-section codes — the additive grain of the stec fact. Grouped codes (A_B, D_E, I_L_O-U) and TOTAL/UNK overlap them, so STEC value metrics filter to this."
        data_tests: [not_null]
        dimension:
          type: categorical

  - name: dim_enterprise_characteristic
    description: "Enterprise characteristic dimension for the stec fact (size class, EBOPS 2010 product, enterprise control). Composite key: characteristic_key (type || '-' || code)."
    semantic_model:
      enabled: true
    columns:
      - name: characteristic_key
        data_tests:
          - not_null
          - unique
        description: "Composite key: characteristic_type || '-' || characteristic_code.  Used for joins to the fact table into Power BI."
        entity:
          type: primary
          name: characteristic
        dimension:
          type: categorical
          name: characteristic_key
      - name: characteristic_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [size_class, ebops_2010, enterprise_control]
        dimension:
          type: categorical
      - name: characteristic_code
        data_tests: [not_null]
        dimension:
          type: categorical
      - name: characteristic_label
        data_tests: [not_null]
        dimension:
          type: categorical
          label: "Characteristic"
