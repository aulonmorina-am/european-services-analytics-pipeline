# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "european_services_analytics"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "european_services_analytics"

# Keep local validation working when the optional private-key environment
# variable is not configured.
vars:
  dbt_private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH', '') }}"
  snapshot_schema: "{{ 'dev_snapshots' if target.name == 'dev' else 'snapshots' }}"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  european_services_analytics:
    # Medallion layers. The +schema values become the schema name (dev_ prefixed
    # on the dev target, see macros/generate_schema_name.sql).
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Reference seeds (Eurostat codelist codes present in the data) live in their own
# schema so they never collide with medallion layers.
seeds:
  european_services_analytics:
    +schema: reference
