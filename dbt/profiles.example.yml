# Template for the dbt profile. Copy it to your host profile location (docker-compose
# bind-mounts %USERPROFILE%\.dbt to /root/.dbt, read-only):
#
#   copy dbt\profiles.example.yml %USERPROFILE%\.dbt\profiles.yml
#
# All secrets come from environment variables (.env locally, GitHub secrets in CI).
# The dev target writes dev_* schemas inside ANALYTICS (see macros/generate_schema_name.sql);
# only the prod target writes the real staging/intermediate/marts schemas.
european_services_analytics:
  # Default target: a plain `dbt build` in the container always hits dev, never prod.
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      # Defaults to the path bind-mounted by docker-compose; override via env when running outside the container.
      private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH', '/run/secrets/dbt/rsa_key.p8') }}"
      private_key_passphrase: "{{ env_var('DBT_PRIVATE_KEY_PASSPHRASE', '') }}"
      database: EUROPEAN_SERVICES_ANALYTICS
      warehouse: TRANSFORM_WH
      schema: DEV
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH', '/run/secrets/dbt/rsa_key.p8') }}"
      private_key_passphrase: "{{ env_var('DBT_PRIVATE_KEY_PASSPHRASE', '') }}"
      database: EUROPEAN_SERVICES_ANALYTICS
      warehouse: TRANSFORM_WH
      schema: MARTS
      threads: 4
