name: Extract Eurostat data

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated dataset codes; leave empty for all configured datasets"
        required: false
        type: string
      run_year:
        description: "Run one year only; leave empty for all configured years"
        required: false
        type: string
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read
  id-token: write

jobs:
  extract:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_FILESYSTEM: ${{ vars.AZURE_STORAGE_FILESYSTEM }}
      AZURE_STORAGE_ROOT_PATH: raw/eurostat
      EUROSTAT_DATASETS: ${{ github.event_name == 'workflow_dispatch' && inputs.datasets || '' }}
      EUROSTAT_RUN_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.run_year || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Extract and publish Eurostat datasets
        run: uv run python -m extract.eurostat.workflow
