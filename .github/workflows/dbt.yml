name: dbt

# CI/CD only deploys to production. The dev target (EUROPEAN_SERVICES_ANALYTICS.DEV_*
# schemas) is local-only and is never run in CI — see docs/system-design.md.
on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
      - "pyproject.toml"
      - "uv.lock"
  # Manual runs: the job-level `if: github.ref == 'refs/heads/main'` guard ensures
  # a dispatch on a feature branch never reaches prod.
  workflow_dispatch:
  # Monthly data refresh: extractor runs on the 1st, Fivetran syncs within ~2 days,
  # dbt rebuilds marts on the 5th. Scheduled runs fire on the default branch, so the
  # main-only guard below still holds.
  schedule:
    - cron: "0 6 5 * *"

permissions:
  contents: read

# Never run two prod deploys concurrently (double push / dispatch+schedule overlap).
concurrency:
  group: dbt-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Belt and braces: even if the trigger filter is bypassed, only main deploys.
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      DBT_PROFILES_DIR: .ci/dbt_profiles
      DBT_PRIVATE_KEY_PATH: .ci/dbt_rsa_key.p8
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      DBT_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install dbt packages
        run: uv run dbt deps --project-dir dbt

      - name: Verify package lockfile
        run: git diff --exit-code dbt/package-lock.yml

      - name: Write Snowflake private key
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          printf '%s' "${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}" > "$DBT_PRIVATE_KEY_PATH"
          chmod 600 "$DBT_PRIVATE_KEY_PATH"

      - name: Install dbt profile from template
        run: cp dbt/profiles.example.yml "$DBT_PROFILES_DIR/profiles.yml"

      # Gate: fail the deploy if the RAW sources are stale (dead extractor/Fivetran sync).
      - name: Check source freshness
        run: uv run dbt source freshness --project-dir dbt --target prod

      # Seeds are load-once tables: dbt truncates and re-inserts into the existing
      # table, so a seed whose CSV gains a column fails with "invalid identifier"
      # against the old schema. full-refresh drops and recreates them.
      - name: Load seeds (prod target)
        run: uv run dbt seed --project-dir dbt --target prod --full-refresh

      - name: Build and test models (prod target)
        run: uv run dbt build --project-dir dbt --target prod

      # Semantic manifest is validated by parse/build; list semantic-layer
      # resources so the Lightdash-facing layer is visibly deployed.
      - name: Validate semantic layer resources (prod)
        run: uv run dbt ls --project-dir dbt --target prod --resource-type semantic_model --resource-type metric --output name

      - name: Generate docs
        run: uv run dbt docs generate --project-dir dbt --target prod

      # Persist the prod manifest so PR (Slim CI) jobs can diff against it with --state/--defer.
      # semantic_manifest.json + osi_document.json are also uploaded: dbt writes them
      # at parse time but they are otherwise discarded when the runner is torn down,
      # which loses the per-deploy record of the semantic layer definition.
      - name: Upload prod manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/semantic_manifest.json
            dbt/target/osi_document.json
          retention-days: 30
