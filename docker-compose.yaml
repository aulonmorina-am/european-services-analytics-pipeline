services:
  dbt:
    build: .
    working_dir: /workspace/dbt

    volumes:
      - .:/workspace

      # dbt profile
      - type: bind
        source: "${USERPROFILE}/.dbt"
        target: /root/.dbt
        read_only: true

      # Snowflake private key
      - type: bind
        source: "${USERPROFILE}/.snowflake/keys/dbt"
        target: /run/secrets/dbt
        read_only: true

    env_file:
      - path: .env
        required: false

    environment:
      DBT_PROFILES_DIR: /root/.dbt
      DBT_PRIVATE_KEY_PATH: /run/secrets/dbt/rsa_key.p8
      DBT_PRIVATE_KEY_PASSPHRASE: "${DBT_PRIVATE_KEY_PASSPHRASE:-}"
